databases:
  - name: insighti-postgres
    databaseName: insighti_db
    user: insighti_user
    plan: free
    region: singapore

services:
  - type: web
    name: mobile_app_new
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && node scripts/ensure-korean-font.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RENDER_REGION
        value: singapore
      - key: BACKEND_URL
        value: https://insighti-app-new.onrender.com
      - key: UPLOAD_DIR
        value: ./uploads
      - key: JWT_SECRET
        value: insighti-super-secret-key-2024
      - key: JWT_EXPIRES_IN
        value: 3d
      - key: DATABASE_URL
        fromDatabase:
          name: insighti-postgres
          property: connectionString
