# main 브랜치 푸시 시 Render(백엔드)·Vercel(프론트) 자동 배포
# - Render: 저장소 연결 시 push마다 자동 빌드·배포 (render.yaml 기준)
# - Vercel: 저장소 연결 시 push마다 자동 배포
name: Deploy

on:
  push:
    branches: [main]

jobs:
  # 푸시 시 배포 트리거 확인 (Render/Vercel이 각자 배포 수행)
  deploy-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 배포 트리거
        run: |
          echo "✅ main에 push되었습니다."
          echo "📦 Render(백엔드)와 Vercel(프론트)이 연결되어 있으면 자동으로 배포가 시작됩니다."
          echo "   - 백엔드: https://dashboard.render.com"
          echo "   - 프론트: https://vercel.com/dashboard"

  # 백엔드 헬스 체크 (배포 완료 후 서버 응답 확인, 선택)
  verify-backend:
    runs-on: ubuntu-latest
    needs: deploy-trigger
    steps:
      - name: 대기 후 백엔드 헬스·DB·로그인 확인
        run: |
          echo "⏳ Render 빌드 대기 중 (약 5분)..."
          sleep 300
          echo "=== /health ==="
          curl -sf --max-time 60 https://insighti-app-new.onrender.com/health || exit 1
          echo ""
          echo "=== /health?db=1 ==="
          curl -sf --max-time 60 "https://insighti-app-new.onrender.com/health?db=1" || exit 1
          echo ""
          echo "=== login smoke test ==="
          code=$(curl -s -o /tmp/login.json -w "%{http_code}" --max-time 90 \
            -X POST https://insighti-app-new.onrender.com/api/auth/session \
            -H "Content-Type: application/json" \
            -d '{"complex":"admin","dong":"000","ho":"000"}')
          echo "HTTP $code"
          cat /tmp/login.json
          test "$code" = "200" || exit 1
